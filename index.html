<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lopez Bar Works">
<meta name="theme-color" content="#17130F">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Lopez Bar Works</title>
<style>
  :root{
    --bg:#17130F; --bg2:#1E1811; --card:#241D15; --card2:#2C2419;
    --line:#3A2F22; --ink:#F3EADB; --mut:#A89A86; --faint:#7C7062;
    --amber:#E0A94E; --amber-d:#B9863A; --mint:#7FD1B9; --oxblood:#9E4B45;
    --r:16px; --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{padding-bottom:calc(24px + var(--safe-b))}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}

  /* header */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,rgba(23,19,15,0));
    padding:calc(14px + var(--safe-t)) 16px 8px}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .wordmark{font-size:13px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;color:var(--amber)}
  .count{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .title{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:2px 0 12px}
  .search{position:relative;margin-bottom:10px}
  .search input{width:100%;padding:13px 40px 13px 40px;border-radius:13px;border:1px solid var(--line);
    background:var(--bg2);color:var(--ink);font-size:16px;outline:none}
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--amber-d)}
  .search .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--faint);
    background:none;border:none;font-size:20px;padding:6px;cursor:pointer;display:none}

  /* chip rows */
  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
  .chiprow::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--mut);font-size:13px;font-weight:600;letter-spacing:.01em;cursor:pointer;
    transition:background .12s,color .12s,border-color .12s;white-space:nowrap}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--amber);color:#241d10;border-color:var(--amber)}
  .chip.mood-r.on{background:var(--mint);color:#0d2a22;border-color:var(--mint)}
  .chip.mood-w.on{background:var(--amber);color:#2a1f0c;border-color:var(--amber)}
  .chip.fav.on{background:var(--oxblood);color:#fbeae8;border-color:var(--oxblood)}

  .morebar{display:flex;align-items:center;gap:10px;margin-top:4px}
  .morebtn{background:none;border:none;color:var(--faint);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;font-weight:700;cursor:pointer;padding:4px 0}
  .morebtn .car{display:inline-block;transition:transform .18s;font-size:10px}
  .morebtn.open .car{transform:rotate(90deg)}
  .reset{margin-left:auto;background:none;border:none;color:var(--amber);font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;font-weight:700;cursor:pointer;padding:4px 0;visibility:hidden}
  .reset.show{visibility:visible}

  .more{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .more.open{max-height:640px}
  .grp{padding-top:8px}
  .grp h4{margin:6px 2px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .grp .chiprow{flex-wrap:wrap;overflow:visible}
  .grp .chip{flex:0 0 auto}

  /* results */
  main{padding:6px 16px 40px}
  .rescount{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
    margin:10px 2px 8px;display:flex;align-items:center;gap:8px}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:15px 16px;cursor:pointer;transition:background .12s,border-color .12s}
  .card:active{background:var(--card2)}
  .card .top{display:flex;align-items:center;gap:10px}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--faint)}
  .dot.r{background:var(--mint)} .dot.w{background:var(--amber)}
  .card h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1}
  .heart{background:none;border:none;font-size:18px;line-height:1;color:var(--faint);cursor:pointer;padding:2px 2px 2px 8px}
  .heart.on{color:var(--oxblood)}
  .card .meta{margin-top:5px;font-size:12.5px;color:var(--mut)}
  .card .meta .sp{color:var(--amber);font-weight:600;text-transform:capitalize}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .tag{font-size:11px;color:var(--mut);background:var(--bg2);border:1px solid var(--line);
    padding:3px 8px;border-radius:7px;letter-spacing:.02em}
  .empty{text-align:center;color:var(--mut);padding:60px 20px;line-height:1.6}
  .empty b{color:var(--ink);display:block;margin-bottom:4px;font-size:16px}

  /* detail sheet */
  .scrim{position:fixed;inset:0;background:rgba(8,6,4,.6);opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:40;backdrop-filter:blur(2px)}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg2);
    border-top-left-radius:22px;border-top-right-radius:22px;border-top:1px solid var(--line);
    max-height:90vh;transform:translateY(101%);transition:transform .28s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column}
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 2px}
  .shead{display:flex;align-items:flex-start;gap:12px;padding:6px 20px 14px;border-bottom:1px solid var(--line)}
  .shead .info{flex:1}
  .shead h2{margin:2px 0 4px;font-size:24px;font-weight:800;letter-spacing:-.01em}
  .shead .sub{font-size:12.5px;color:var(--amber);text-transform:capitalize;font-weight:600;letter-spacing:.02em}
  .shead .aka{color:var(--faint);text-transform:none;font-weight:500}
  .sclose{background:var(--card);border:1px solid var(--line);color:var(--mut);width:34px;height:34px;
    border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
  .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px calc(30px + var(--safe-b))}
  .sect{margin-bottom:18px}
  .sect h5{margin:0 0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:700}
  ul.ing{list-style:none;margin:0;padding:0}
  ul.ing li{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid rgba(58,47,34,.5);font-size:15px;line-height:1.35}
  ul.ing li:last-child{border-bottom:none}
  ul.ing .amt{color:var(--amber);flex:0 0 auto;min-width:74px;font-size:13.5px}
  ul.ing .nm{color:var(--ink)}
  .spec{display:flex;flex-direction:column;gap:6px}
  .spec .row{display:flex;gap:10px;font-size:14.5px}
  .spec .k{color:var(--faint);min-width:74px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
  .spec .v{color:var(--ink);flex:1;text-transform:capitalize}
  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber-d);
    border-radius:10px;padding:12px 14px;color:var(--mut);font-size:14px;line-height:1.5}
  .stags{display:flex;flex-wrap:wrap;gap:6px}
  .flag{font-size:12px;color:var(--oxblood);background:rgba(158,75,69,.12);border:1px solid rgba(158,75,69,.4);
    padding:6px 10px;border-radius:8px;margin-top:4px;line-height:1.4}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="wordmark">Lopez Bar Works</span><span class="count" id="count"></span></div>
  <div class="title">What are we making?</div>
  <div class="search">
    <span class="mag">⌕</span>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off"
      placeholder="Search a name or ingredient…">
    <button class="clr" id="clr" aria-label="Clear">×</button>
  </div>
  <div class="chiprow" id="spiritRow"></div>
  <div class="chiprow" id="moodRow"></div>
  <div class="morebar">
    <button class="morebtn" id="moreBtn"><span class="car">▸</span> More filters</button>
    <button class="reset" id="reset">Clear all</button>
  </div>
  <div class="more" id="more"></div>
</header>
<main>
  <div class="rescount" id="rescount"></div>
  <div class="list" id="list"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="shead">
    <div class="info"><h2 id="dName"></h2><div class="sub" id="dSub"></div></div>
    <button class="sclose" id="dClose" aria-label="Close">×</button>
  </div>
  <div class="sbody" id="dBody"></div>
</div>

const saveFav = ()=>{ try{ localStorage.setItem('backbar_fav',JSON.stringify([...FAV])); }catch(e){} };

const state = { q:"", spirits:new Set(), moods:new Set(), seasons:new Set(),
  strength:new Set(), flavors:new Set(), occasions:new Set(), noegg:false, quick:false, favonly:false };

// build filter chips
function chip(label,cls,on,onclick){
  const b=document.createElement('button'); b.className='chip'+(cls?' '+cls:''); b.textContent=label;
  if(on) b.classList.add('on'); b.addEventListener('click',()=>{onclick(b)}); return b;
}
const spiritRow=document.getElementById('spiritRow');
Object.keys(SPIRIT_GROUPS).forEach(g=>{
  spiritRow.appendChild(chip(g,'',false,b=>{toggle(state.spirits,g,b);render()}));
});
const moodRow=document.getElementById('moodRow');
moodRow.appendChild(chip('❄ Refreshing','mood-r',false,b=>{toggle(state.moods,'refreshing',b);render()}));
moodRow.appendChild(chip('♨ Warming','mood-w',false,b=>{toggle(state.moods,'warming',b);render()}));
moodRow.appendChild(chip('♥ Favorites','fav',false,b=>{state.favonly=!state.favonly;b.classList.toggle('on');render()}));

// more filters
const more=document.getElementById('more');
function group(title,items,build){
  const g=document.createElement('div');g.className='grp';
  const h=document.createElement('h4');h.textContent=title;g.appendChild(h);
  const row=document.createElement('div');row.className='chiprow';items.forEach(it=>row.appendChild(build(it)));
  g.appendChild(row);more.appendChild(g);
}
group('Season',['Summer','Winter'],s=>chip(s,'',false,b=>{toggle(state.seasons,s.toLowerCase(),b);render()}));
group('Strength',[['Sessionable','sessionable'],['Boozy','boozy']],
  p=>chip(p[0],'',false,b=>{toggle(state.strength,p[1],b);render()}));
group('Flavor',FLAVORS,f=>chip(cap(f),'',false,b=>{toggle(state.flavors,f,b);render()}));
group('Occasion',OCCASIONS,o=>chip(cap(o),'',false,b=>{toggle(state.occasions,o,b);render()}));
group('Other',[['No egg','noegg'],['Quick','quick']],
  p=>chip(p[0],'',false,b=>{state[p[1]]=!state[p[1]];b.classList.toggle('on');render()}));

function toggle(set,val,btn){ set.has(val)?set.delete(val):set.add(val); btn.classList.toggle('on'); }

// interactions
document.getElementById('moreBtn').addEventListener('click',e=>{
  more.classList.toggle('open'); e.currentTarget.classList.toggle('open');
});
const q=document.getElementById('q'), clr=document.getElementById('clr');
q.addEventListener('input',()=>{ state.q=q.value.trim().toLowerCase(); clr.style.display=q.value?'block':'none'; render(); });
clr.addEventListener('click',()=>{ q.value='';state.q='';clr.style.display='none';q.focus();render(); });
document.getElementById('reset').addEventListener('click',()=>location.reload());

// matching
function spiritMatch(r){
  if(!state.spirits.size) return true;
  for(const g of state.spirits){ if(SPIRIT_GROUPS[g].includes(r.base_spirit)) return true;
    for(const s of (r.spirits||[])) if(SPIRIT_GROUPS[g].includes(s)) return true; }
  return false;
}
const inc = (lvl)=> lvl==='high'||lvl==='medium';
function matches(r){
  if(state.favonly && !FAV.has(r.name)) return false;
  if(!spiritMatch(r)) return false;
  if(state.moods.has('refreshing') && !inc(r.refreshing)) return false;
  if(state.moods.has('warming') && !inc(r.warming)) return false;
  if(state.seasons.size && ![...state.seasons].some(s=>(r.seasons||[]).includes(s))) return false;
  if(state.strength.size && !state.strength.has(r.strength)) return false;
  if(state.flavors.size && ![...state.flavors].some(f=>(r.flavors||[]).includes(f))) return false;
  if(state.occasions.size && ![...state.occasions].some(o=>(r.occasions||[]).includes(o))) return false;
  if(state.noegg && r.egg) return false;
  if(state.quick && r.effort!=='easy') return false;
  if(state.q){
    const hay=[r.name,(r.aka||[]).join(' '),(r.ingredients||[]).join(' '),(r.spirits||[]).join(' '),r.notes||'']
      .join(' ').toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}
const rank = r => (state.moods.has('refreshing')&&r.refreshing==='high')||(state.moods.has('warming')&&r.warming==='high')?0:1;

function anyFilter(){ return state.q||state.spirits.size||state.moods.size||state.seasons.size||
  state.strength.size||state.flavors.size||state.occasions.size||state.noegg||state.quick||state.favonly; }

// split an ingredient line into amount + name for the mono column
function splitAmt(line){
  const m=line.match(/^\s*([\d¼½¾⅓⅔.\/\s-]*(?:oz|ml|dash(?:es)?|tsp|tbsp|barspoon|bar spoon|scoop|drops?|slices?|leaves|leaf|sprigs?|pinch)?[.)]?\s*(?:\([^)]*\))?)\s*(.*)$/i);
  if(m && m[1] && /\d|¼|½|¾|⅓|⅔/.test(m[1])) return [m[1].trim(), m[2].trim()];
  return ["", line.trim()];
}

const list=document.getElementById('list');
function render(){
  const out=RECIPES.filter(matches).sort((a,b)=> rank(a)-rank(b) || a.name.localeCompare(b.name));
  document.getElementById('count').textContent=RECIPES.length+' recipes';
  document.getElementById('reset').classList.toggle('show',!!anyFilter());
  document.getElementById('rescount').textContent = out.length+(out.length===1?' drink':' drinks');
  list.innerHTML='';
  if(!out.length){
    list.innerHTML='<div class="empty"><b>Nothing matches that mix.</b>Loosen a filter — try dropping the flavor or season.</div>';
    return;
  }
  out.forEach(r=>{
    const c=document.createElement('div');c.className='card';
    const dcls=r.refreshing==='high'?'r':(r.warming==='high'?'w':'');
    const quick=(r.flavors||[]).slice(0,3).map(cap).join(' · ');
    const fav=FAV.has(r.name)?'on':'';
    c.innerHTML=`<div class="top"><span class="dot ${dcls}"></span><h3></h3>
      <button class="heart ${fav}" aria-label="Favorite">${fav?'♥':'♡'}</button></div>
      <div class="meta"><span class="sp">${r.base_spirit}</span>${quick?' — '+quick:''}</div>`;
    c.querySelector('h3').textContent=r.name;
    c.querySelector('.heart').addEventListener('click',e=>{e.stopPropagation();
      if(FAV.has(r.name))FAV.delete(r.name);else FAV.add(r.name);saveFav();render();});
    c.addEventListener('click',()=>openSheet(r));
    list.appendChild(c);
  });
}

// detail sheet
const scrim=document.getElementById('scrim'), sheet=document.getElementById('sheet');
function openSheet(r){
  document.getElementById('dName').textContent=r.name;
  const aka=(r.aka&&r.aka.length)?` · aka ${r.aka.join(', ')}`:'';
  const moodTxt = r.refreshing==='high'?'refreshing':(r.warming==='high'?'warming':'');
  document.getElementById('dSub').innerHTML=`${r.base_spirit}${moodTxt?' · '+moodTxt:''}<span class="aka">${aka}</span>`;
  const b=document.getElementById('dBody'); b.innerHTML='';
  // ingredients
  const s1=document.createElement('div');s1.className='sect';
  s1.innerHTML='<h5>Ingredients</h5><ul class="ing"></ul>';
  const ul=s1.querySelector('ul');
  (r.ingredients||[]).forEach(line=>{const[a,n]=splitAmt(line);const li=document.createElement('li');
    li.innerHTML=`<span class="amt mono">${a||'—'}</span><span class="nm">${n}</span>`;ul.appendChild(li);});
  b.appendChild(s1);
  // method / glass / garnish
  const rows=[];
  if(r.method) rows.push(['Method',r.method]);
  if(r.glass) rows.push(['Glass',r.glass]);
  if(r.garnish) rows.push(['Garnish',r.garnish]);
  if(rows.length){const s2=document.createElement('div');s2.className='sect';
    s2.innerHTML='<h5>How to make it</h5><div class="spec"></div>';
    const sp=s2.querySelector('.spec');
    rows.forEach(([k,v])=>{const row=document.createElement('div');row.className='row';
      row.innerHTML=`<span class="k">${k}</span><span class="v">${v}</span>`;sp.appendChild(row);});
    b.appendChild(s2);}
  // note
  if(r.notes){const s3=document.createElement('div');s3.className='sect';
    s3.innerHTML=`<h5>Note</h5><div class="note"></div>`;s3.querySelector('.note').textContent=r.notes;b.appendChild(s3);}
  if(r.needs_review){const f=document.createElement('div');f.className='flag';
    f.textContent='Source was a little ambiguous — worth double-checking this one.';b.appendChild(f);}
  b.scrollTop=0;
  scrim.classList.add('open');sheet.classList.add('open');
}
function closeSheet(){scrim.classList.remove('open');sheet.classList.remove('open');}
scrim.addEventListener('click',closeSheet);
document.getElementById('dClose').addEventListener('click',closeSheet);

render();
</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script>
</body>
</html>
